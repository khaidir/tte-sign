# PKI Uji — TTE Test PKI
# O=UJI — TIDAK UNTUK PRODUKSI
#
# Keys are generated by build_pki.py and stored in the keys/ subdirectory.
# This config references those key files.

keysets:
  tte-test:
    keys:
      tte-test-root:
        path: keys/tte-test-root.pem
      psre-ca:
        path: keys/psre-ca.pem
      signer-valid:
        path: keys/signer-valid.pem
      signer-ecdsa:
        path: keys/signer-ecdsa.pem
      signer-expired:
        path: keys/signer-expired.pem
      signer-notyet:
        path: keys/signer-notyet.pem
      signer-revoked:
        path: keys/signer-revoked.pem
      signer-nokeyusage:
        path: keys/signer-nokeyusage.pem
      server-seal:
        path: keys/server-seal.pem
      tsa:
        path: keys/tsa.pem
      ocsp:
        path: keys/ocsp.pem
      untrusted-root:
        path: keys/untrusted-root.pem
      signer-untrusted:
        path: keys/signer-untrusted.pem

pki-architectures:
  tte-test:
    keyset: tte-test
    entities:
      tte-test-root:
        common_name: Root CA Indonesia (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
      psre-ca:
        common_name: PSrE Contoh CA (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
      signer-valid:
        common_name: Penanda Tangan Valid (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
        email_address: signer-valid@uji.example.com
      signer-ecdsa:
        common_name: Penanda Tangan ECDSA (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
        email_address: signer-ecdsa@uji.example.com
      signer-expired:
        common_name: Penanda Tangan Kedaluwarsa (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
      signer-notyet:
        common_name: Penanda Tangan Belum Berlaku (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
      signer-revoked:
        common_name: Penanda Tangan Dicabut (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
      signer-nokeyusage:
        common_name: Penanda Tangan Tanpa Key Usage (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
      server-seal:
        common_name: PT Contoh Indonesia (Segel)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
      tsa:
        common_name: TSA Uji (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
      ocsp:
        common_name: OCSP Responder Uji (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
      untrusted-root:
        common_name: Root Tidak Terpercaya (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI
      signer-untrusted:
        common_name: Penanda Tangan Tidak Terpercaya (UJI)
        organization_name: UJI — TIDAK UNTUK PRODUKSI

    certs:
      # Root CA
      tte-test-root:
        subject: tte-test-root
        issuer: tte-test-root
        subject-key: tte-test-root
        authority-key: tte-test-root
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2045-01-01T00:00:00Z'
        extensions:
          - id: basic_constraints
            critical: true
            value:
              ca: true
              path_len_constraint: 1
          - id: key_usage
            critical: true
            value: !!set
              key_cert_sign: null
              crl_sign: null

      # Intermediate CA
      psre-ca:
        subject: psre-ca
        issuer: tte-test-root
        subject-key: psre-ca
        authority-key: tte-test-root
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2035-01-01T00:00:00Z'
        extensions:
          - id: basic_constraints
            critical: true
            value:
              ca: true
              path_len_constraint: 0
          - id: key_usage
            critical: true
            value: !!set
              key_cert_sign: null
              crl_sign: null
          - id: crl_distribution_points
            critical: false
            smart_value:
              schema: crl-dist-url
              params:
                crl-repo-names:
                  - psre-ca
          - id: authority_information_access
            critical: false
            smart_value:
              schema: aia-urls
              params:
                ocsp-responder-names:
                  - psre-ca

      # Signer: Valid
      signer-valid:
        subject: signer-valid
        issuer: psre-ca
        subject-key: signer-valid
        authority-key: psre-ca
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2030-01-01T00:00:00Z'
        extensions:
          - id: key_usage
            critical: true
            value: !!set
              digital_signature: null
              non_repudiation: null

      # Signer: ECDSA
      signer-ecdsa:
        subject: signer-ecdsa
        issuer: psre-ca
        subject-key: signer-ecdsa
        authority-key: psre-ca
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2030-01-01T00:00:00Z'
        extensions:
          - id: key_usage
            critical: true
            value: !!set
              digital_signature: null
              non_repudiation: null

      # Signer: Expired
      signer-expired:
        subject: signer-expired
        issuer: psre-ca
        subject-key: signer-expired
        authority-key: psre-ca
        validity:
          valid_from: '2020-01-01T00:00:00Z'
          valid_to: '2024-12-31T00:00:00Z'
        extensions:
          - id: key_usage
            critical: true
            value: !!set
              digital_signature: null
              non_repudiation: null

      # Signer: Not Yet Valid
      signer-notyet:
        subject: signer-notyet
        issuer: psre-ca
        subject-key: signer-notyet
        authority-key: psre-ca
        validity:
          valid_from: '2099-01-01T00:00:00Z'
          valid_to: '2104-01-01T00:00:00Z'
        extensions:
          - id: key_usage
            critical: true
            value: !!set
              digital_signature: null
              non_repudiation: null

      # Signer: Revoked
      signer-revoked:
        subject: signer-revoked
        issuer: psre-ca
        subject-key: signer-revoked
        authority-key: psre-ca
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2030-01-01T00:00:00Z'
        extensions:
          - id: key_usage
            critical: true
            value: !!set
              digital_signature: null
              non_repudiation: null
        revocation:
          revoked_since: '2025-01-01T00:00:00Z'

      # Signer: No Key Usage
      signer-nokeyusage:
        subject: signer-nokeyusage
        issuer: psre-ca
        subject-key: signer-nokeyusage
        authority-key: psre-ca
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2030-01-01T00:00:00Z'
        extensions:
          - id: key_usage
            critical: true
            value: !!set
              key_encipherment: null

      # Server Seal
      server-seal:
        subject: server-seal
        issuer: psre-ca
        subject-key: server-seal
        authority-key: psre-ca
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2030-01-01T00:00:00Z'
        extensions:
          - id: key_usage
            critical: true
            value: !!set
              digital_signature: null
              non_repudiation: null

      # TSA
      tsa:
        subject: tsa
        issuer: psre-ca
        subject-key: tsa
        authority-key: psre-ca
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2030-01-01T00:00:00Z'
        extensions:
          - id: key_usage
            critical: true
            value: !!set
              digital_signature: null
          - id: extended_key_usage
            critical: true
            value: !!set
              time_stamping: null

      # OCSP Responder
      ocsp:
        subject: ocsp
        issuer: psre-ca
        subject-key: ocsp
        authority-key: psre-ca
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2030-01-01T00:00:00Z'
        extensions:
          - id: key_usage
            critical: true
            value: !!set
              digital_signature: null
          - id: extended_key_usage
            critical: true
            value: !!set
              ocsp_signing: null

      # Untrusted Root
      untrusted-root:
        subject: untrusted-root
        issuer: untrusted-root
        subject-key: untrusted-root
        authority-key: untrusted-root
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2045-01-01T00:00:00Z'
        extensions:
          - id: basic_constraints
            critical: true
            value:
              ca: true
              path_len_constraint: 1
          - id: key_usage
            critical: true
            value: !!set
              key_cert_sign: null
              crl_sign: null

      # Untrusted Signer
      signer-untrusted:
        subject: signer-untrusted
        issuer: untrusted-root
        subject-key: signer-untrusted
        authority-key: untrusted-root
        validity:
          valid_from: '2025-01-01T00:00:00Z'
          valid_to: '2030-01-01T00:00:00Z'
        extensions:
          - id: key_usage
            critical: true
            value: !!set
              digital_signature: null
              non_repudiation: null

    services:
      time-stamping:
        tsa:
          signing_cert: tsa
          certs_to_embed:
            - tsa

      ocsp:
        psre-ca:
          for_issuer: psre-ca
          responder_cert: ocsp

      crl-repo:
        psre-ca:
          for_issuer: psre-ca
          simulated_update_schedule: P1D
