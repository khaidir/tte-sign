[project]
name = "tte-pdf-backend"
version = "1.0.0"
description = "Mini App TTE PDF — Backend API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-multipart>=0.0.12,<1",
    "orjson>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.28,<1",
    "hypothesis>=6,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
