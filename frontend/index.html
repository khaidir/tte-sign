<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TTE PDF — Tanda Tangan Elektronik untuk dokumen PDF" />
    <title>TTE PDF</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
</head>

<body>
    <div id="app">
        <header class="app-header">
            <h1>TTE PDF</h1>
            <nav class="app-nav">
                <span class="step active">① Unggah</span>
                <span class="step">② Tempatkan</span>
                <span class="step">③ Unduh</span>
            </nav>
            <a href="/verify" class="nav-link">Verifikasi</a>
        </header>
        <main id="main-content">
            <section id="upload-section" class="section">
                <h2>Unggah Dokumen PDF</h2>
                <p class="section-desc">Seret berkas PDF ke sini atau klik untuk memilih.</p>
                <div id="upload-zone" class="upload-zone">
                    <p>Tarik PDF ke sini</p>
                    <input type="file" id="file-input" accept=".pdf,application/pdf" />
                    <label for="file-input" class="btn btn-primary">Pilih PDF</label>
                </div>
            </section>
            <section id="editor-section" class="section" style="display:none">
                <div id="viewer-container"></div>
                <aside id="sidebar"></aside>
            </section>
            <section id="result-section" class="section" style="display:none">
                <p>Dokumen siap diunduh.</p>
            </section>
        </main>
        <footer class="app-footer">
            <p>Dokumen dihapus otomatis setelah 30 menit.</p>
        </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
